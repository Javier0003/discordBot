services:
  discord-bot:
    build:
      context: .
      dockerfile: dockerfile  
    ports:
      - '42069:42069'
    environment:
      - DOMAIN=${DOMAIN:-https://loabot.darkjaslo.dev}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-loabot}
      - MIGRATOR_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-loabot}
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env

  postgres_db:
    image: postgres:16.2-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB:-loabot}
    ports:
      - '5432:5432'
    volumes:
      - postgres_db:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_db:
    driver: local 

networks:
  default:
    name: loa_network
    driver: bridge
